spring.application.name=user-tracking-extension-backend

# Database configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:1234/user_tracking}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_tracking}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:user_tracking}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server port
server.port=8080

# Gemini Configuration
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/
gemini.model=gemini-1.5-flash
